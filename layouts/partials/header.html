<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}">
      {{ if .Site.Params.logo }}
      <img class="brand-logo" src="{{ .Site.Params.logo | strings.TrimPrefix "/" | absURL }}" alt="{{ .Site.Params.nickname }}">
      {{ else }}
      {{ .Site.Params.nickname }}<span class="dot">_</span>
      {{ end }}
    </a>
    <button type="button" class="nav-toggle" id="navToggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="mainNav">
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>
    <nav class="main-nav" id="mainNav">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" {{ if eq $.RelPermalink .URL }}class="is-active"{{ end }}>{{ .Name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
